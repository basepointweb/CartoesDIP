<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DIP Cartoes - Criancas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #2f2927;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 30px 20px;
      color: #f5efe6;
    }

    h1.page-title {
      text-align: center;
      color: #c79a57;
      margin-bottom: 30px;
      font-size: 1.6rem;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 860px;
      margin: 0 auto;
    }

    .card {
      background: #f5efe6;
      border-radius: 16px;
      border: 1px solid #8f6a3a;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }

    .card-header {
      background-color: #4a3b34;
      color: #f8f4ee;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 16px;
      border-bottom: 2px solid #c79a57;
    }

    .card-header .header-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 50%;
    }

    .card-header .header-category {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
      color: #d8ab67;
    }

    .card-header .header-divider {
      width: 2px;
      height: 36px;
      background: rgba(216,171,103,0.45);
      flex-shrink: 0;
    }

    .card-header .header-country {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .card-body {
      display: flex;
      padding: 24px 20px 20px;
      gap: 20px;
    }

    .card-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-width: 180px;
      max-width: 200px;
      flex-shrink: 0;
      border-right: 1px solid #d8c2a3;
      padding-right: 20px;
    }

    .card-left .flag-img {
      width: 160px;
      height: 100px;
      border-radius: 6px;
      border: 1px solid #b89463;
      object-fit: cover;
      background: #e8dccb;
    }

    .card-left .country-name {
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 800;
      color: #6f4e2c;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      color: #2f2927;
    }

    .card-right ul {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-right ul li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.97rem;
      color: #2f2927;
      line-height: 1.5;
    }

    .card-right ul li::before {
      content: "\25CF";
      color: #b8863b;
      font-size: 0.7rem;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .ranking-block {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      white-space: nowrap;
      flex: 1;
      gap: 8px;
      min-width: 0;
    }
    .ranking-block .ranking-label {
      font-size: 1.5rem;
      font-weight: 700;
      color: #4a3b34;
    }
    .ranking-block .ranking-number {
      font-size: 1.5rem;
      font-weight: 900;
      color: #c79a57;
      line-height: 1.1;
    }

    .card-footer-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid #d8c2a3;
      flex-wrap: nowrap;
    }

    .card-footer-row .org-block {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .card-footer-row .org-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .footer-divider {
      width: 1px;
      height: 60px;
      background: #cdb08a;
      flex-shrink: 0;
    }

    .card-footer-row .qr-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
      flex-shrink: 0;
    }

    .card-footer-row .qr-block .qr-label {
      font-size: 0.85rem;
      color: #8f6a3a;
      font-weight: 700;
    }

    .card-footer-row .qr-block .qr-sublabel {
      font-size: 0.78rem;
      color: #6b5a4d;
    }

    .card-footer-row .qr-img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border: 1px solid #8f6a3a;
      border-radius: 4px;
      flex-shrink: 0;
      background: #fff;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      @page {
        size: A4;
        margin: 8mm;
      }

      body {
        background: #ffffff;
        padding: 0;
        color: #2f2927;
      }

      h1.page-title {
        margin: 0 0 5mm 0;
        font-size: 13pt;
        color: #8f6a3a;
      }

      .cards-container {
        max-width: none;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 5mm;
      }

      .card {
        break-inside: avoid;
        page-break-inside: avoid;
        box-shadow: none;
        border-radius: 10px;
      }

      .card-header {
        padding: 6px 10px;
      }

      .card-header .header-icon {
        width: 28px;
        height: 28px;
      }

      .card-header .header-category,
      .card-header .header-country {
        font-size: 10pt;
      }

      .card-body {
        padding: 10px 10px 8px;
        gap: 10px;
      }

      .card-left {
        min-width: 115px;
        max-width: 125px;
        padding-right: 10px;
      }

      .card-left .flag-img {
        width: 110px;
        height: 70px;
      }

      .card-left .country-name {
        margin-top: 5px;
        font-size: 8pt;
      }

      .card-right ul {
        gap: 6px;
      }

      .card-right ul li {
        font-size: 8.5pt;
        line-height: 1.22;
      }

      .ranking-block .ranking-label,
      .ranking-block .ranking-number {
        font-size: 10.5pt;
      }

      .card-footer-row {
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
        padding-top: 7px;
      }

      .card-footer-row .org-logo {
        width: 44px;
        height: 44px;
      }

      .footer-divider {
        height: 44px;
      }

      .card-footer-row .qr-img {
        width: 90px;
        height: 90px;
        border: 1px solid #8f6a3a;
      }

      .card-footer-row .qr-block .qr-label {
        font-size: 8pt;
      }

      .card-footer-row .qr-block .qr-sublabel {
        font-size: 7pt;
      }
    }

    @media (max-width: 600px) {
      .card-body { flex-direction: column; }
      .card-left {
        border-right: none;
        border-bottom: 1px solid #d8c2a3;
        padding-right: 0;
        padding-bottom: 16px;
        max-width: 100%;
        flex-direction: row;
        gap: 16px;
      }
      .card-header .header-category,
      .card-header .header-country { font-size: 1rem; }
    }
  </style>
</head>

    function createImage(className, src, alt) {
      return `<img class="${className}" src="${src}" alt="${alt}" onerror="this.style.display='none'"/>`;
    }

    function renderCard(card) {
      const prayers = card.prayers.map(prayer => `<li>${prayer}</li>`).join('');
      const logos = orgLogos.map(logo => createImage('org-logo', logo.src, logo.alt)).join('');

      return `
        <div class="card">
          <div class="card-header">
            ${createImage('header-icon', card.icon, card.iconAlt)}
            <span class="header-category">${card.category}</span>
            <div class="header-divider"></div>
            <span class="header-country">${card.countryHeader}</span>
          </div>
          <div class="card-body">
            <div class="card-left">
              ${createImage('flag-img', card.flag, card.flagAlt)}
              <span class="country-name">${card.countryName}</span>
            </div>
            <div class="card-right">
              <ul>${prayers}</ul>
              <div class="card-footer-row">
                <div class="ranking-block">
                  <span class="ranking-label">Posição no ranking:</span>
                  <span class="ranking-number">${card.ranking}</span>
                </div>
                <div class="org-block">${logos}</div>
                <div class="footer-divider"></div>
                <div class="qr-block">
                  <span class="qr-label">Leia o QR Code</span>
                  <span class="qr-sublabel">para saber mais</span>
                </div>
                ${createImage('qr-img', card.qr, 'QR Code')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    document.getElementById('cards-container').innerHTML = cards.map(renderCard).join('');
